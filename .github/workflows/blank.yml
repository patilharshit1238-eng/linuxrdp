```yaml
name: Ubuntu RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install Desktop and XRDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11

      - name: Create RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          sudo useradd -m -s /bin/bash rdpuser || true
          echo "rdpuser:${RDP_PASSWORD}" | sudo chpasswd
          sudo usermod -aG sudo rdpuser

      - name: Configure XFCE
        run: |
          sudo tee /home/rdpuser/.xsession > /dev/null <<'EOF'
          xfce4-session
          EOF

          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Start XRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          sudo systemctl status xrdp --no-pager

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Get Tailscale IP
        run: |
          echo "=========================================="
          echo "        UBUNTU RDP IS READY"
          echo "=========================================="
          echo ""
          echo "Tailscale IP:"
          tailscale ip -4
          echo ""
          echo "RDP address:"
          echo "$(tailscale ip -4):3389"
          echo ""
          echo "Username:"
          echo "rdpuser"
          echo ""
          echo "=========================================="

      - name: Check XRDP
        run: |
          sleep 3

          if sudo ss -lntp | grep -q ":3389"; then
            echo "XRDP is listening on port 3389."
          else
            echo "XRDP is NOT listening."
            sudo journalctl -u xrdp --no-pager -n 100
            exit 1
          fi

      - name: Keep RDP Running
        run: |
          while true; do
            echo "=========================================="
            echo "RDP SERVER RUNNING"
            echo "Time: $(date)"
            echo "Tailscale IP: $(tailscale ip -4)"
            echo "XRDP: $(sudo systemctl is-active xrdp)"
            echo "=========================================="

            sleep 60
          done
```
